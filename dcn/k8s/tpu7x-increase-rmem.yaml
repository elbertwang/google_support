# Adapted from GoogleCloudPlatform/ai-on-gke v6e-increase-rmem.yaml at
# 51bf3dcab6ff658cf62cc32867f96860bf58dfdc. The only scheduling change is
# matching TPU7x nodes; the init container also logs the before/after values.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tcp-increase-rmem
  namespace: kube-system
  labels:
    k8s-app: tcp-increase-rmem
spec:
  selector:
    matchLabels:
      k8s-app: tcp-increase-rmem
  template:
    metadata:
      labels:
        k8s-app: tcp-increase-rmem
    spec:
      priorityClassName: system-node-critical
      hostNetwork: true
      hostPID: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: cloud.google.com/gke-tpu-accelerator
                operator: In
                values:
                - tpu7x
      tolerations:
      - operator: Exists
        effect: NoExecute
      - operator: Exists
        effect: NoSchedule
      initContainers:
      - name: tcp-increase-rmem
        image: ubuntu:latest
        securityContext:
          privileged: true
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          echo "TCP_RMEM_BEFORE $(cat /proc/sys/net/ipv4/tcp_rmem)"
          echo "4096 41943040 314572800" > /proc/sys/net/ipv4/tcp_rmem
          echo "TCP_RMEM_AFTER $(cat /proc/sys/net/ipv4/tcp_rmem)"
        volumeMounts:
        - name: sys
          mountPath: /sys
        - name: proc
          mountPath: /proc
      volumes:
      - name: sys
        hostPath:
          path: /sys
          type: Directory
      - name: proc
        hostPath:
          path: /proc
          type: Directory
      containers:
      - image: gke.gcr.io/pause:3.8@sha256:880e63f94b145e46f1b1082bb71b85e21f16b99b180b9996407d61240ceb9830
        name: pause
