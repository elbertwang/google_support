# Replace __IMAGE__, __SLICE0_NODEPOOL__, and __SLICE1_NODEPOOL__.
# The explicit node-pool selectors guarantee two distinct physical 2x2x1 slices.
apiVersion: v1
kind: Service
metadata:
  name: dcn-coordinator
spec:
  clusterIP: None
  selector:
    app: dcn-google-baseline
    dcn-slice: "0"
  ports:
  - {name: jax, port: 1234, targetPort: 1234}
  - {name: megascale, port: 8081, targetPort: 8081}
---
apiVersion: v1
kind: Pod
metadata:
  name: dcn-google-baseline-s0
  labels: {app: dcn-google-baseline, dcn-slice: "0"}
spec:
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-nodepool: __SLICE0_NODEPOOL__
    cloud.google.com/gke-tpu-accelerator: tpu7x
    cloud.google.com/gke-tpu-topology: 2x2x1
  containers:
  - name: benchmark
    image: __IMAGE__
    env:
    - {name: DCN_SLICE_ID, value: "0"}
    - {name: DCN_COORDINATOR_ADDRESS, value: "dcn-coordinator:1234"}
    - {name: DCN_INTERFACES, value: "eth1,eth2,lo"}
    resources:
      requests: {google.com/tpu: "4", ephemeral-storage: 20Gi}
      limits: {google.com/tpu: "4"}
    ports:
    - {name: jax-coordinator, containerPort: 1234}
    - {name: megascale, containerPort: 8081}
    - {name: tpu-runtime, containerPort: 8471}
---
apiVersion: v1
kind: Pod
metadata:
  name: dcn-google-baseline-s1
  labels: {app: dcn-google-baseline, dcn-slice: "1"}
spec:
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-nodepool: __SLICE1_NODEPOOL__
    cloud.google.com/gke-tpu-accelerator: tpu7x
    cloud.google.com/gke-tpu-topology: 2x2x1
  containers:
  - name: benchmark
    image: __IMAGE__
    env:
    - {name: DCN_SLICE_ID, value: "1"}
    - {name: DCN_COORDINATOR_ADDRESS, value: "dcn-coordinator:1234"}
    - {name: DCN_INTERFACES, value: "eth1,eth2,lo"}
    resources:
      requests: {google.com/tpu: "4", ephemeral-storage: 20Gi}
      limits: {google.com/tpu: "4"}
    ports:
    - {name: jax-coordinator, containerPort: 1234}
    - {name: megascale, containerPort: 8081}
    - {name: tpu-runtime, containerPort: 8471}
