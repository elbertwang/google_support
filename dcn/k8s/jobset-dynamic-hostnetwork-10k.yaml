# Kueue TAS dynamic 2x2x1 slices, host network, and the XLA-requested 10k warmup.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dcn-dyn-hn-10k
  labels:
    app: dcn-dyn-hn-10k
    kueue.x-k8s.io/queue-name: default
spec:
  coordinator:
    replicatedJob: slice
    jobIndex: 0
    podIndex: 0
  failurePolicy:
    maxRestarts: 0
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
  - name: slice
    replicas: 2
    template:
      spec:
        parallelism: 1
        completions: 1
        completionMode: Indexed
        backoffLimit: 0
        template:
          metadata:
            annotations:
              cloud.google.com/gke-tpu-slice-topology: 2x2x1
            labels:
              app: dcn-dyn-hn-10k
          spec:
            restartPolicy: Never
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
            tolerations:
            - key: google.com/tpu
              operator: Exists
              effect: NoSchedule
            containers:
            - name: benchmark
              image: __IMAGE__
              imagePullPolicy: Always
              command:
              - /bin/bash
              - -lc
              - |
                set -euo pipefail
                echo "DCN_TCP_RMEM $(cat /proc/sys/net/ipv4/tcp_rmem)"
                exec /workspace/google_support/dcn/k8s/entrypoint.sh
              env:
              - name: JOBSET_JOB_INDEX
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/job-index']
              - name: DCN_COORDINATOR_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/coordinator']
              - name: DCN_INTERFACES
                value: eth1,eth2,lo
              - name: DCN_BENCHMARK_PATH
                value: /workspace/google_support/dcn/timing_benchmark.py
              - name: DCN_SOURCE_BENCHMARK
                value: /workspace/google_support/dcn/benchmark.py
              - name: DCN_EXPERIMENT
                value: dynamic_hostnetwork_10k
              - name: DCN_DIMS
                value: "16384"
              - name: DCN_VARIANTS
                value: all_reduce
              - name: DCN_WARMUPS
                value: "10000"
              - name: DCN_REPS
                value: "20"
              - name: DCN_BATCH
                value: "10"
              resources:
                requests:
                  google.com/tpu: "4"
                  ephemeral-storage: 20Gi
                limits:
                  google.com/tpu: "4"
              ports:
              - {name: jax-coordinator, containerPort: 1234}
              - {name: megascale, containerPort: 8081}
              - {name: tpu-runtime, containerPort: 8471}
